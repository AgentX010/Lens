name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci || npm install
      - run: node node_modules/prisma/build/index.js generate
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test --if-present
      # Network-scope guard: fails the build if any raw SQL query touches a
      # network-scoped table (e.g. price_points) without a network predicate,
      # unless it is listed with a reason in the test's allow-list.
      - name: Network scope guard
        run: npx vitest run tests/network-scope.test.ts
